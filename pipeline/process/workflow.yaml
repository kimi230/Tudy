# ==============================================================================
# stdyEng 영상 처리 워크플로우
# ==============================================================================
# 참조: pipeline/bootstrap.yaml (마스터 정의)
#
# YouTube URL → 학습 콘텐츠 생성 (3-Phase)
# Phase 1: 도구 (기계적 처리)
# Phase 2: Claude Code 직접 수행 (번역 + 분석)
# Phase 3: 도구 (마무리)

workflow:
  name: video_process_pipeline
  version: "3.1"

# ==============================================================================
# 입력
# ==============================================================================
input:
  required:
    url:
      type: string
      description: "YouTube/bilibili 영상 URL"
    category:
      type: enum
      values: [pronunciation, business, daily, academic, travel, tech, current, culture, science, motivation, news, anime]
      description: "학습 카테고리"
  optional:
    language:
      type: enum
      values: [en, zh, ja]
      default: en
      description: "대상 언어 (en=영어, zh=중국어, ja=일본어)"
    difficulty:
      type: enum
      values: [beginner, elementary, intermediate, upper-intermediate, advanced]
      description: "난이도 (미지정 시 Claude Code가 판단)"
    title_override:
      type: string
      description: "제목 수동 지정"

# ==============================================================================
# 출력
# ==============================================================================
output:
  directory: "apps/{language_app}/public/data/{videoId}/"
  files:
    - meta.json
    - segments.json
    - vocabulary.json
    - grammar.json
    - connected_speech.json  # EN: 연음, ZH: 성조, JA: 경어
    - structure.json
    - study_guide.html
    - study_guide.pdf
  index: "apps/{language_app}/public/data/videos.json"

# ==============================================================================
# Phase 1: 도구 (기계적 처리)
# ==============================================================================
phase_1:
  name: "다운로드 + STT + 세그먼트 정제"
  executor: bash
  command: >
    python3 pipeline/process/process_video.py
    --url "{url}"
    --category "{category}"
    --language "{language}"
    --mechanical-only
  steps:
    - extract_metadata   # yt-dlp로 메타데이터 추출
    - download_audio     # yt-dlp로 오디오 다운로드 (MP3)
    - transcribe         # mlx-whisper로 STT (word-level timestamps)
    - clean_segments     # 세그먼트 병합/분리/정규화
  output:
    - "{videoId}/_raw_metadata.json"
    - "{videoId}/_clean_segments.json"

# ==============================================================================
# Phase 2: Claude Code 직접 수행
# ==============================================================================
# 이 단계들은 Claude Code가 파일을 읽고 자체 능력으로 분석한 뒤
# 결과를 JSON 파일로 직접 작성한다. 외부 LLM 호출 없음.

phase_2:
  name: "번역 + 분석"
  executor: claude_code

  steps:
    # --- 2-1. 번역 ---
    - id: translate
      name: "한국어 번역"
      input: "{videoId}/_clean_segments.json"
      output: "{videoId}/segments.json"
      action: |
        _clean_segments.json의 각 세그먼트를 읽고:
        1. 각 세그먼트의 textEn을 자연스러운 한국어로 번역
        2. textKo 필드 추가
        3. 세그먼트 index/start/end/textEn/words는 그대로 유지
      format:
        schema: |
          {
            "videoId": "{videoId}",
            "segments": [
              {
                "index": 0,
                "start": 0.0,
                "end": 5.2,
                "textEn": "original english text",
                "textKo": "번역된 한국어 텍스트",
                "words": [{"word": "...", "start": 0.0, "end": 0.5}]
              }
            ]
          }

    # --- 2-2. 난이도 추정 ---
    - id: estimate_difficulty
      name: "난이도 추정"
      depends_on: [translate]
      input: "{videoId}/segments.json"
      output: "(difficulty 값 → Phase 3에 전달)"
      action: |
        segments.json를 읽고 다음 기준으로 난이도 판단:
        - WPM (분당 단어 수): beginner(<120), intermediate(120-160), advanced(>160)
        - 어휘 복잡도: 일상 어휘 vs 학술/전문 어휘 비율
        - 문장 구조 복잡성

    # --- 2-3 ~ 2-6: 병렬 분석 가능 ---
    - id: extract_vocabulary
      name: "어휘 추출 + 어원 분석"
      depends_on: [translate]
      input: "{videoId}/segments.json"
      output: "{videoId}/vocabulary.json"
      action: |
        segments.json를 읽고 학습 가치가 높은 어휘 15~30개 추출:
        - 단어, 발음(IPA), 품사, 정의(영/한), 어원
        - 해당 단어가 등장하는 segmentIndex
        - 예문 (영상 내 문맥) + 예문 한국어 번역 (contextSentenceKo) 필수
        - 어근 분해 (prefix/root/suffix)
        - 관련 단어 (같은 어근)
      format:
        schema: |
          [
            {
              "word": "vulnerability",
              "phonetic": "/ˌvʌlnərəˈbɪləti/",
              "partOfSpeech": "noun",
              "definition": "the quality of being easily hurt or attacked",
              "meaningKo": "취약성, 상처받기 쉬운 상태",
              "etymology": "Latin vulnerabilis (wounding) → ...",
              "rootBreakdown": { "prefix": null, "root": "vulner- (상처)", "suffix": "-ability (할 수 있는 상태)" },
              "relatedWords": ["vulnerable", "invulnerable"],
              "isEssential": true,
              "segmentIndex": 3,
              "contextSentence": "Vulnerability is the birthplace of innovation.",
              "contextSentenceKo": "취약성은 혁신의 출발점입니다."
            }
          ]

    - id: analyze_grammar
      name: "문법 패턴 분석"
      depends_on: [translate]
      input: "{videoId}/segments.json"
      output: "{videoId}/grammar.json"
      action: |
        segments.json를 읽고 주요 문법 패턴 8~15개 분석:
        - 패턴명, 설명(영/한), 난이도
        - 영상 내 실제 사용 예시 + segmentIndex
        - 각 예문의 한국어 번역 (examplesKo) 필수 포함

        ■ 순수 문법의 정의:
          언어의 구조적 규칙으로, 시간·관계·조건·수식 등을 나타내는
          체계적 형태 변화나 절 구조. 화자의 수사적 의도나 담화 전략이 아닌
          문법적 기능에 초점을 맞춘다.

        ✓ 포함 대상 (문법적 기능 중심):
          시제, 조건문(0차/1차/2차/3차), 가정법, 관계절, 분열문(It is...that),
          화법(직접/간접), 비교급/최상급, 수동태, 조동사, 동명사/부정사,
          접속사(whether...or, so that, in order to), 분사구문, 존재 표현(There is/are),
          강조 do/does, by + -ing, instead of + -ing, had better

        ✗ 절대 포함하지 않는 항목:
          [수사적 기법]
          × 수사적 질문 (Rhetorical Questions: "How could it be...?", "Why is it that...?")
          × 반복/아나포라 (Repetition: "We call them... because", "Grit is -ing, -ing, -ing")
          × 병렬 구조 (Parallel Structure — 수사적 나열 목적)
          × 수사적 장치 (Metaphor, Analogy, Chiasmus, Litotes, Antithesis)
          × 리프레이밍 ("It's not about X. It's about Y", "Not A but B" — 대조 강조)
          [담화 전략]
          × 담화 표지 ("It turns out", "As such", "The truth of the matter is",
            "Here's the thing", "In other words", "As a matter of fact")
          × 청중 참여 기법 ("By a show of hands", "If there's one thing you take away")
          × 열거/순서 표지 ("Number one", "First", "Finally")
          × 자기 교정 ("I keep using this word...", "What I mean is...")
          [검증 기준]
          × 설명에 "dramatic", "persuasive", "powerful", "engaging", "rhetorical",
            "audience" 등 수사적 목적 용어가 포함되면 비문법일 가능성 높음
          × 패턴이 문법 규칙 없이 특정 표현/관용구만 나열하면 비문법
      format:
        schema: |
          [
            {
              "pattern": "Present Perfect for Life Experience",
              "explanation": "Used to talk about experiences without specifying when",
              "explanationKo": "구체적 시점 없이 경험을 이야기할 때 사용하는 현재완료",
              "examples": ["I have spent my career studying vulnerability."],
              "examplesKo": ["저는 취약성을 연구하는 데 커리어를 보냈습니다."],
              "segmentIndex": 2
            }
          ]

    - id: analyze_connected_speech
      name: "연음/발음 분석"
      depends_on: [translate]
      input: "{videoId}/segments.json"
      output: "{videoId}/connected_speech.json"
      action: |
        segments.json를 읽고 연음/발음 현상 10~20개 분석:
        - 연음 (linking), 탈락 (elision), 축약 (reduction), 동화 (assimilation)
        - 각 현상의 원래 발음 vs 실제 발음
        - 한국어 음사 + 연습 가이드
      format:
        schema: |
          [
            {
              "type": "linking",
              "originalText": "kind of",
              "phonetic": "/kaɪn.dəv/",
              "koreanPhonetic": "카인더브",
              "explanation": "The /d/ in 'kind' links to the vowel /ɒ/ in 'of'",
              "explanationKo": "'kind'의 /d/가 'of'의 모음에 연결됨",
              "practiceGuide": "'카인더브'라고 빠르게 말해보세요",
              "segmentIndex": 5
            }
          ]

    - id: analyze_structure
      name: "스피치 구조 분석"
      depends_on: [translate]
      input: "{videoId}/segments.json"
      output: "{videoId}/structure.json"
      action: |
        segments.json를 읽고 전체 스피치/영상의 구조 분석:
        - 영상 카드용 한국어 한 줄 소제목(descriptionKo) 생성 (무엇에 대한 영상인지)
        - 서론/본론/결론 등 섹션 구분
        - 각 섹션의 영어 제목(title) + 한국어 소제목(titleKo) 필수 생성
        - 각 섹션의 시작/끝 세그먼트 + 요약
        - 전환 표현 (signal expressions) 추출
      format:
        schema: |
          {
            "descriptionKo": "이 영상의 핵심 주제를 한 줄로 요약",
            "sections": [
              {
                "title": "Opening Hook",
                "titleKo": "도입: 관심 끌기",
                "section": "Introduction",
                "startSegment": 0,
                "endSegment": 3,
                "summary": "Speaker introduces the topic",
                "summaryKo": "화자가 주제를 소개함",
                "keyPoints": ["핵심 포인트 1", "핵심 포인트 2"]
              }
            ],
            "signalExpressions": [
              {
                "expression": "Let me start by...",
                "type": "hook",
                "segmentIndex": 0,
                "role": "서론 시작을 알리는 표현"
              }
            ]
          }

    # --- 2-7. 세그먼트별 듣기 난이도 ---
    - id: score_difficulty
      name: "세그먼트별 듣기 난이도 계산"
      depends_on: [translate, extract_vocabulary, analyze_grammar, analyze_connected_speech]
      executor: bash
      command: >
        python3 pipeline/process/difficulty_scorer.py --video-id "{videoId}"
      action: |
        segments.json + 분석 파일(vocabulary, grammar, connected_speech)을 기반으로
        각 세그먼트에 1~5 듣기 난이도(listenDifficulty) 점수 부여.
        segments.json에 in-place 업데이트.

# ==============================================================================
# Phase 3: 도구 (마무리)
# ==============================================================================
phase_3:
  name: "meta.json 생성 + 인덱스 업데이트"
  executor: bash
  depends_on: [translate, extract_vocabulary, analyze_grammar, analyze_connected_speech, analyze_structure, score_difficulty]
  command: >
    python3 pipeline/process/process_video.py
    --video-id "{videoId}"
    --finalize
    --category "{category}"
    --difficulty "{difficulty}"
    --language "{language}"
  actions:
    - "segments.json 등 분석 파일에서 통계 계산"
    - "structure.json의 descriptionKo(없으면 섹션 요약)로 영상 카드 소제목 자동 생성"
    - "meta.json 생성"
    - "videos.json 인덱스 업데이트"
    - "중간 파일 (_raw_*, _clean_*) 정리"
  output:
    - "{videoId}/meta.json"

# ==============================================================================
# Phase 4: PDF 생성
# ==============================================================================
phase_4:
  name: "학습 가이드 PDF 생성"
  executor: bash
  depends_on: [phase_3]
  command: >
    python3 pipeline/pdf/generate_pdf.py
    --video-id "{videoId}"
    --language "{language}"
  output:
    - "{videoId}/study_guide.html"
    - "{videoId}/study_guide.pdf"
  on_fail: warn  # PDF 생성 실패 시 경고만 (전체 파이프라인 중단하지 않음)

# ==============================================================================
# 품질 체크리스트
# ==============================================================================
quality_checklist:
  - "segments.json: 세그먼트별 텍스트가 정확한가?"
  - "segments.json: 타임스탬프가 영상과 일치하는가?"
  - "segments.json: 한국어 번역이 자연스러운가?"
  - "vocabulary.json: 어원/어근(etymology/components)이 정확한가?"
  - "vocabulary.json: 핵심 단어를 빠뜨리지 않았는가?"
  - "grammar.json: 문법 설명이 정확한가?"
  - "grammar.json: examplesKo가 모든 예문에 포함되어 있는가?"
  - "grammar.json: 수사법/담화 전략이 아닌 실제 문법 패턴만 포함되어 있는가?"
  - "connected_speech.json: 발음 분석이 정확한가?"
  - "structure.json: 서론/본론/결론 구분이 적절한가?"
  - "structure.json: 각 섹션에 title/titleKo가 모두 포함되어 있는가?"
  - "meta.json: 난이도 분류가 적절한가?"
  - "videos.json: 인덱스에 정상 추가되었는가?"
  - "study_guide.pdf: PDF가 정상 생성되었는가?"
