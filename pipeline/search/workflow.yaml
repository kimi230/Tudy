# ==============================================================================
# 난이도 프로파일 (video_search.py DIFFICULTY_PROFILES와 동기화)
# ==============================================================================
difficulty_profiles:
  beginner:
    target_wpm: [90, 120]
    duration_sec: [300, 480]
  elementary:
    target_wpm: [120, 140]
    duration_sec: [360, 540]
  intermediate:
    target_wpm: [140, 160]
    duration_sec: [420, 720]
  upper-intermediate:
    target_wpm: [160, 185]
    duration_sec: [480, 840]
  advanced:
    target_wpm: [185, 220]
    duration_sec: [540, 900]
