# ==============================================================================
# Instagram Reel Generation Workflow
# ==============================================================================
# 영상의 핵심 구간을 의미론적으로 파악 → 제목 작성 → 2-pass 릴스 생성
#
# 릴스 구조:
#   1회차: 제목 + 영어자막 + 카운트다운 ("자막 Ns")
#   2회차: 제목 + 영어자막 + 한국어자막
#
# 전체 과정에서 Claude Code가 LLM 역할 수행 (핵심 구간 선정 + 제목 작성)

name: Reel Generation
version: "1.0"

# ==============================================================================
# Step 1: 핵심 구간 선정 (Claude Code 직접 — 스크립트 기반)
# ==============================================================================
# 기존: structure.json 섹션 메타데이터만 보고 선정 → Hook/Intro 편향 문제
# 변경: segments.json 전체 스크립트를 읽고 의미론적으로 최적 구간 선정
step_1_select_section:
  executor: claude
  action: |
    1. segments.json 전체 읽기 (textEn + textKo + timestamps)
       — 스크립트 전문을 직접 읽고 내용을 파악한다
    2. structure.json 참조하여 섹션 맥락 파악 (보조 정보)
    3. 릴스에 적합한 **~20초 연속 구간** 선정 (2-pass 후 ~40초):
       선정 기준 (우선순위 순):
       a. 핵심 인사이트/반전/깨달음이 담긴 구간 (Hook/Intro 보다 핵심 메시지 우선)
       b. ~20초 분량 (2-4 세그먼트)
       c. 독립적으로 이해 가능 (앞뒤 맥락 없이도 의미 전달)
       d. 문장이 자연스럽게 시작/끝나는 지점
    4. start_segment, end_segment 결정 후 해당 세그먼트 재확인
  input:
    - "apps/english/public/data/{videoId}/segments.json"   # 주 입력: 전체 스크립트
    - "apps/english/public/data/{videoId}/structure.json"  # 보조: 섹션 맥락
  output:
    - start_segment (int)
    - end_segment (int)
    - 구간 요약
    - 선정 사유

# ==============================================================================
# Step 2: 제목 작성 (Claude Code 직접)
# ==============================================================================
step_2_write_headline:
  executor: claude
  action: |
    선정된 구간의 핵심 메시지를 한국어 제목으로 작성.
    규칙:
      - 호기심 유발 (X: "신경가소성에 대해" → O: "나이 들어도 뇌는 계속 변한다")
      - 15자 내외 (릴스 상단에 2줄 이내)
      - 시청자가 "더 보고 싶다"고 느낄 것
      - 구어체/대화체 선호
  output:
    - headline (str): 한국어 제목

# ==============================================================================
# Step 3: 릴스 생성 (bash: generate_reel.py)
# ==============================================================================
step_3_generate:
  executor: bash
  command: >
    python3 pipeline/instagram/generate_reel.py
    --video-id "{videoId}"
    --start-segment {start_segment}
    --end-segment {end_segment}
    --headline "{headline}"
    --output-dir "pipeline/instagram/output/{date}_reel"
  output: "pipeline/instagram/output/{date}_reel/clip.mp4"
  description: |
    2-pass 릴스 생성:
    - Raw clip 추출 (trim filter, frame-accurate)
    - 클립 × 2 concat
    - ASS 오버레이 (제목 + 카운트다운 + 자막)
    레이아웃: templates.py 고정값 사용

# ==============================================================================
# Step 4: 캡션 작성 (Claude Code 직접)
# ==============================================================================
step_4_caption:
  executor: claude
  action: |
    릴스 콘텐츠에 맞는 Instagram 캡션 작성:
    1. 호기심 유발 첫 줄 (headline 변형)
    2. 인사이트 요약 2-3줄
    3. "자막 켜고 두 번 보세요" 안내
    4. 해시태그 15-20개
    5. CTA (프로필 링크 유도)
  output: "pipeline/instagram/output/{date}_reel/caption.json"

# ==============================================================================
# CLI Quick Reference
# ==============================================================================
cli:
  generate: >
    python3 pipeline/instagram/generate_reel.py
    --video-id {videoId}
    --start-segment {n}
    --end-segment {n}
    --headline "제목"
  from_candidates: >
    python3 pipeline/instagram/generate_reel.py --from-candidates
