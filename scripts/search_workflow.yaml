# ==============================================================================
# stdyEng 영상 검색 워크플로우
# ==============================================================================
# 참조: scripts/bootstrap.yaml (마스터 정의)
#
# 사용자 요구에 맞는 YouTube 영상을 검색하고 추천
# 예: "중급 동기부여 영상 찾아줘"

workflow:
  name: video_search_pipeline
  version: "2.0"

# ==============================================================================
# 입력
# ==============================================================================
input:
  level:
    type: enum
    values: [beginner, intermediate, advanced]
    default: intermediate
    description: "학습 난이도"
  category:
    type: enum
    values: [pronunciation, business, daily, academic, travel, tech, current, culture, science, motivation]
    description: "콘텐츠 카테고리"
  topics:
    type: list[string]
    default: []
    description: "특정 토픽 (선택)"
  count:
    type: integer
    default: 5
    description: "최종 추천 영상 수"

# ==============================================================================
# 단계
# ==============================================================================
steps:

  # --- Step 1: 검색 + 기초 분석 (도구) ---
  - id: search_and_analyze
    name: "검색 + 분석"
    executor: bash
    command: >
      python scripts/video_search.py
      --level {level}
      --category {category}
      --topics "{topics}"
    output: scripts/.tmp/candidates.json
    description: |
      1. 레벨/카테고리/토픽으로 검색 쿼리 생성
      2. yt-dlp ytsearch로 후보 검색 (20~100개)
      3. 길이/조회수/언어 필터 (10~30 후보)
      4. 자막 다운로드 + WPM/어휘빈도/문장길이 분석
    fallback:
      - if: "candidates < 10 → --max-results 20 으로 쿼리 확장 재시도"
      - if: "candidates < 5 → 큐레이션 채널 직접 검색 폴백"

  # --- Step 2: 구조/콘텐츠 평가 (Claude Code 직접) ---
  - id: evaluate
    name: "구조/콘텐츠 평가"
    executor: claude_code
    input: scripts/.tmp/candidates.json
    output: scripts/.tmp/evaluated.json
    action: |
      candidates.json의 각 후보 영상 자막(subtitle_text)을 읽고 평가:
      1. structure (1~10): 서론/본론/결론 구조 명확성
      2. content (1~10): 교육적, 긍정적, 사고 촉진
      3. clarity (1~10): 화자 발음 명료성 (자막 품질로 추정)
      4. engagement (1~10): 학습자 흥미도
      5. category: 최적 카테고리 추천
      6. summary: 1줄 한국어 요약
    reject_if: "structure < 4 or content < 4"
    format:
      schema: |
        [
          {
            "video_id": "...",
            "structure": 8,
            "content": 7,
            "clarity": 9,
            "engagement": 8,
            "category": "motivation",
            "summary": "1줄 한국어 요약"
          }
        ]

  # --- Step 3: 랭킹 (도구) ---
  - id: rank
    name: "중복체크 + 종합 랭킹"
    executor: bash
    command: >
      python scripts/video_search.py
      --rank
      --evaluated scripts/.tmp/evaluated.json
      --count {count}
    input: scripts/.tmp/evaluated.json
    output: scripts/.tmp/recommendations.json
    description: |
      1. 기존 videos.json과 비교하여 중복 제거
      2. 종합 스코어링:
         - 난이도 적합도 35%
         - 어휘 접근성 25%
         - 구조 20%
         - 콘텐츠 15%
         - 채널 5%

  # --- Step 4: 결과 표시 + 선택 → 처리 (Claude Code 직접) ---
  - id: present_and_process
    name: "결과 표시 + 영상 처리"
    executor: claude_code
    action: |
      1. recommendations.json 읽어서 사용자에게 표 형태로 표시:
         | # | 제목 | 채널 | 길이 | 점수 | 요약 |
      2. 사용자가 선택하면 → workflow.yaml (영상 처리 워크플로우) 실행

# ==============================================================================
# 큐레이션 소스
# ==============================================================================
curated_sources:
  high_priority_channels:
    - TED
    - TEDx Talks
    - TED-Ed

  category_channels:
    science: [CrashCourse, Veritasium, "Kurzgesagt -- In a Nutshell"]
    business: [Harvard Business Review, Stanford Graduate School of Business, Talks at Google]
    tech: [Google, MIT OpenCourseWare, Computerphile]
    motivation: [Goalcast, Motivation2Study]
    academic: [MIT OpenCourseWare, Stanford, Yale Courses]
    culture: [TED-Ed, National Geographic]

  legendary_speakers:
    - Simon Sinek
    - "Bren\xE9 Brown"
    - Tim Urban
    - Dan Pink
    - Amy Cuddy
    - Hans Rosling
    - Ken Robinson
    - Yuval Noah Harari
    - Malcolm Gladwell
    - Angela Duckworth
    - Adam Grant
    - Susan Cain

# ==============================================================================
# 난이도 프로파일
# ==============================================================================
difficulty_profiles:
  beginner:
    target_wpm: [90, 130]
    duration_sec: [300, 480]
    search_modifiers: ["easy", "simple", "for beginners"]
  intermediate:
    target_wpm: [130, 170]
    duration_sec: [420, 720]
    search_modifiers: []
  advanced:
    target_wpm: [160, 220]
    duration_sec: [420, 900]
    search_modifiers: ["in-depth", "advanced", "research"]

# ==============================================================================
# 스코어링 가중치
# ==============================================================================
scoring_weights:
  difficulty_match: 0.35
  vocab_accessibility: 0.25
  structure_quality: 0.20
  content_value: 0.15
  speaker_quality: 0.05
